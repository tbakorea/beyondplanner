name: Planner regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check dashboard/app.js
      - run: node tests/delegation_regression.js
      - run: node tests/postpone_regression.js
      - run: node tests/money_completion_regression.js
      - run: node tests/today_cache_regression.js
      - run: node tests/completion_counter_regression.js
      - run: node tests/resume_save_regression.js
      - run: node tests/save_reliability_regression.js
      - run: python -m unittest discover -s tests
