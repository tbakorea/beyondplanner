name: Planner production reachability
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-read-only:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/browser/production_smoke.py
